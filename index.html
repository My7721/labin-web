<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labin Yapı Lab</title>
<meta name="application-name" content="Labin Yapı Lab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Labin Lab">
<meta name="theme-color" content="#1e3a5f">

<style>
:root {
  --ana: #1a56db; --yesil: #057a55; --kirmizi: #c81e1e;
  --turuncu: #d97706; --mor: #6c2bd9;
  --bg: #f3f4f6; --kart: #fff; --metin: #111827;
  --ikincil: #6b7280; --kenar: #e5e7eb;
  --sidebar: #1e3a5f; --sidebar2: #2d5280;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--metin); }
#app { display: flex; min-height: 100vh; }
/* SIDEBAR */
#sidebar {
  width: 220px; background: var(--sidebar); color: #fff;
  display: flex; flex-direction: column; min-height: 100vh;
  position: fixed; left: 0; top: 0; bottom: 0; z-index: 100;
  transition: transform .3s;
}
#sidebar .logo { padding: 24px 16px 8px; font-size: 20px; font-weight: 700; }
#sidebar .logo-sub { padding: 0 16px 16px; font-size: 12px; color: #94a3b8; }
#sidebar nav a {
  display: block; padding: 10px 16px; color: #cbd5e1; text-decoration: none;
  font-size: 14px; border-radius: 8px; margin: 2px 8px; transition: background .2s;
}
#sidebar nav a:hover, #sidebar nav a.aktif { background: var(--sidebar2); color: #fff; }
#sidebar .sidebar-alt {
  margin-top: auto; padding: 8px;
  display: flex; flex-direction: column; gap: 4px;
}
#sidebar .sidebar-alt a, #sidebar .sidebar-alt button {
  display: block; width: 100%; padding: 8px 12px;
  color: #94a3b8; text-decoration: none; font-size: 12px;
  background: transparent; border: none; cursor: pointer;
  border-radius: 6px; text-align: left;
}
#sidebar .sidebar-alt a:hover, #sidebar .sidebar-alt button:hover { background: var(--sidebar2); color: #fff; }
#sidebar .cikis-btn {
  background: #7f1d1d !important; color: #fca5a5 !important;
  font-weight: 600 !important;
}
#sidebar .kullanici-bilgi {
  padding: 8px 12px; font-size: 11px; color: #64748b;
  border-top: 1px solid #334e6e; margin-top: 4px;
}
/* ANA ICERIK */
#icerik { margin-left: 220px; flex: 1; padding: 24px; min-height: 100vh; }
/* KARTLAR */
.kart-grid { display: grid; gap: 12px; margin-bottom: 16px; }
.kart-grid-4 { grid-template-columns: repeat(4, 1fr); }
.kart-grid-3 { grid-template-columns: repeat(3, 1fr); }
.kart-grid-2 { grid-template-columns: repeat(2, 1fr); }
@media(max-width:900px) {
  .kart-grid-4,.kart-grid-3 { grid-template-columns: repeat(2,1fr); }
  #icerik { padding: 16px; }
}
@media(max-width:600px) {
  .kart-grid-4,.kart-grid-3,.kart-grid-2 { grid-template-columns: repeat(2,1fr); }
  .kart-grid-4.tek { grid-template-columns: 1fr; }
  #sidebar { transform: translateX(-220px); transition: transform .3s; }
  #sidebar.acik { transform: translateX(0); }
  #icerik { margin-left: 0 !important; padding: 12px; }
  #mob-menu-btn { display: flex !important; }
  .sayfa-baslik { font-size: 18px; margin-bottom: 12px; }
  .k-deger { font-size: 16px !important; }
  .k-baslik { font-size: 11px !important; }
  table { font-size: 12px; }
  th, td { padding: 7px 8px; }
  .toolbar { gap: 6px; }
  .btn { padding: 7px 12px; font-size: 12px; }
  .modal { padding: 16px; width: 95%; }
  .form-row, .form-row-3 { grid-template-columns: 1fr; }
  .tablo-wrap { border-radius: 8px; }
}
.kart {
  background: var(--kart); border-radius: 12px;
  border: 1px solid var(--kenar); padding: 16px;
  cursor: pointer; transition: box-shadow .2s;
}
.kart:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
.kart .k-baslik { font-size: 12px; color: var(--ikincil); margin-bottom: 4px; }
.kart .k-deger { font-size: 20px; font-weight: 700; }
/* TABLO */
.tablo-wrap { background: var(--kart); border-radius: 12px; border: 1px solid var(--kenar); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #f8fafc; padding: 10px 12px; text-align: left; font-weight: 600; white-space: nowrap; border-bottom: 1px solid var(--kenar); }
td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; white-space: nowrap; }
tr:hover td { background: #f8fafc; }
tr.tahsil td { color: var(--yesil); background: #f0fdf4; }
tr.beklem td { color: var(--metin); }
/* BUTONLAR */
.btn { padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: opacity .2s; }
.btn:hover { opacity: .85; }
.btn-ana { background: var(--ana); color: #fff; }
.btn-yesil { background: var(--yesil); color: #fff; }
.btn-kirmizi { background: var(--kirmizi); color: #fff; }
.btn-gri { background: #374151; color: #fff; }
.btn-turuncu { background: #d97706; color: #fff; }
.btn-sm { padding: 5px 12px; font-size: 12px; }
/* TOOLBAR */
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar input, .toolbar select {
  padding: 7px 12px; border-radius: 8px; border: 1px solid var(--kenar);
  font-size: 13px; outline: none;
}
/* FORM */
.form-grup { margin-bottom: 12px; }
.form-grup label { display: block; font-size: 13px; color: var(--ikincil); margin-bottom: 4px; }
.form-grup input, .form-grup select, .form-grup textarea {
  width: 100%; padding: 9px 12px; border: 1px solid var(--kenar);
  border-radius: 8px; font-size: 14px; font-family: inherit; outline: none;
}
.form-grup input:focus, .form-grup select:focus { border-color: var(--ana); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: center; z-index: 1000;
}
.modal {
  background: #fff; border-radius: 16px; padding: 28px;
  width: 90%; max-width: 560px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
.modal h3 { font-size: 18px; margin-bottom: 20px; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
/* LOGIN */
#login-screen {
  min-height: 100vh; background: var(--sidebar);
  display: flex; align-items: center; justify-content: center;
}
.login-kart {
  background: #162d4a; border-radius: 16px; padding: 40px;
  width: 380px; text-align: center;
}
.login-kart .logo { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 4px; }
.login-kart .logo-sub { color: #94a3b8; font-size: 13px; margin-bottom: 28px; }
.login-kart input {
  width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155;
  background: #1e293b; color: #fff; font-size: 14px; margin-bottom: 12px; outline: none;
}
.login-kart button {
  width: 100%; padding: 13px; background: var(--ana); color: #fff;
  border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer;
}
.login-kart .hata { color: #ef4444; font-size: 13px; margin-top: 8px; }
/* OZET METINLER */
.sayfa-baslik { font-size: 24px; font-weight: 700; margin-bottom: 20px; }
.section-baslik { font-size: 15px; font-weight: 600; margin: 16px 0 8px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
.badge-yesil { background: #dcfce7; color: var(--yesil); }
.badge-kirmizi { background: #fee2e2; color: var(--kirmizi); }
.badge-turuncu { background: #fef3c7; color: var(--turuncu); }
#mob-menu-btn { display: none; position: fixed; top: 12px; left: 12px; z-index: 200; background: var(--sidebar); color: #fff; border: none; border-radius: 8px; padding: 8px 12px; font-size: 20px; cursor: pointer; }
.menu-grup-baslik {
  padding: 10px 14px 5px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-top: 6px;
  border-top: 1px solid rgba(255,255,255,.06);
}
.menu-grup-baslik.tiklanabilir {
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  user-select: none;
  transition: color .15s;
}
.menu-grup-baslik.tiklanabilir:hover { color: #e2e8f0; }
.menu-grup-icerik { overflow: hidden; transition: max-height .25s ease; }
.menu-grup-icerik.kapali { max-height: 0 !important; }
</style>
</head>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
// Backend adresi - ayni sunucudan geliyorsa bos birak
const API = (window.location.protocol === 'file:' || window.location.hostname === 'localhost')
  ? 'http://localhost:8000'
  : '';  // Railway'de ayni origin, bos birak

let token = localStorage.getItem('token');
let aktifKullanici = JSON.parse(localStorage.getItem('kullanici') || 'null');
let aktifSayfa = 'ozet';

// ── API HELPER ────────────────────────────────────────────────────────────────
async function api(yol, method = 'GET', body = null) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
  };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + yol, opts);
  if (r.status === 401) { cikisYap(); return null; }
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    alert(err.detail || 'Bir hata oluştu');
    return null;
  }
  const sonuc = await r.json();

  // Gecmise kaydet (cop-kutusu ve ayar islemleri haric)
  if (method === 'POST' && !yol.includes('cop-kutusu') && !yol.includes('giris') && !yol.includes('durum') && sonuc?.id) {
    gecmiseEkle({ tip: 'ekle', endpoint: yol, id: sonuc.id, data: body, tarih: new Date().toLocaleTimeString('tr-TR') });
  }
  if (method === 'DELETE' && !yol.includes('cop-kutusu') && !yol.includes('temizle')) {
    // Cop kutusundaki son kaydi bul (az once eklendi)
    try {
      const coplar = await fetch(API + '/cop-kutusu', { headers: {'Authorization': 'Bearer '+token} });
      const copData = await coplar.json();
      const sonCop = copData?.[0];
      gecmiseEkle({ tip: 'sil', silEndpoint: yol, copId: sonCop?.id, tarih: new Date().toLocaleTimeString('tr-TR') });
    } catch(e) {}
  }

  return sonuc;
}

const para = n => new Intl.NumberFormat('tr-TR', {minimumFractionDigits:2}).format(n||0) + ' ₺';
const isAdmin = () => aktifKullanici?.rol === 'admin';
const tarihBugun = () => new Date().toISOString().split('T')[0];

// ── GİRİŞ / ÇIKIŞ ────────────────────────────────────────────────────────────
async function girisYap() {
  const ku = document.getElementById('giris-id').value.trim();
  const sf = document.getElementById('giris-sifre').value.trim();
  const r = await fetch(API + '/giris', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({kullanici_adi: ku, sifre: sf})
  });
  if (!r.ok) {
    document.getElementById('giris-hata').textContent = 'Kullanıcı adı veya şifre yanlış!';
    return;
  }
  const d = await r.json();

function menuGrupToggle(id) {
  const el = document.getElementById(id);
  const ok = document.getElementById(id + '-ok');
  if (!el) return;
  const kapali = el.classList.contains('kapali');
  if (kapali) {
    el.classList.remove('kapali');
    el.style.maxHeight = '300px';
    if (ok) ok.style.transform = 'rotate(0deg)';
  } else {
    el.classList.add('kapali');
    el.style.maxHeight = '0';
    if (ok) ok.style.transform = 'rotate(-90deg)';
  }
}

async function sayfaGit(id) {
  aktifSayfa = id;
  document.querySelectorAll('#nav a').forEach(a => a.classList.remove('aktif'));

  if (el) el.classList.add('aktif');

  const ic = document.getElementById('sayfa-icerik');
  ic.innerHTML = '<p style="color:var(--ikincil);padding:40px">Yükleniyor...</p>';
  await sayfalar[id]?.();
}

// ── MODAL YARDIMCI ────────────────────────────────────────────────────────────
function modal(baslik, icerik, kaydetFn) {
  const m = document.createElement('div');
  m.className = 'modal-overlay';
  m.id = 'aktif-modal';
  m.innerHTML = `<div class="modal">
    <h3>${baslik}</h3>
    ${icerik}
    <div class="modal-footer">
      <button class="btn btn-gri" onclick="modalKapat()">İptal</button>
      <button class="btn btn-ana" onclick="_modalKaydet()">Kaydet</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  window._modalKaydet = async () => { await kaydetFn(); };
}

function modalKapat() {
  document.getElementById('aktif-modal')?.remove();
}

      var tumGiderler = await api('/giderler');
      var giderler = tumGiderler;
      if (giderler && filtreBas && filtreBit) {
        giderler = giderler.filter(function(g) { return g.tarih >= filtreBas && g.tarih <= filtreBit; });
      }
      if (giderler && giderler.length) {
        var katToplam = {};
        giderler.forEach(function(g) { katToplam[g.kategori] = (katToplam[g.kategori]||0) + (g.tutar||0); });
        var items = Object.entries(katToplam).sort(function(a,b){return b[1]-a[1];});
        var renkler = ['#e53e3e','#6c2bd9','#057a55','#d97706','#0891b2','#6b7280','#1a56db'];
        var canvas = document.getElementById('pasta-grafik');
        if (canvas) {
          canvas.width = canvas.offsetWidth || 300; canvas.height = 200;
          var ctx = canvas.getContext('2d');
          var cx=100, cy=100, r=80, baslangic=-Math.PI/2;
          var toplam = items.reduce(function(s,i){return s+i[1];},0);
          items.forEach(function(item, idx) {
            var aci = (item[1]/toplam) * Math.PI*2;
            ctx.beginPath(); ctx.moveTo(cx,cy);
            ctx.arc(cx,cy,r,baslangic,baslangic+aci);
            ctx.fillStyle = renkler[idx % renkler.length]; ctx.fill();
            baslangic += aci;
          });
          var ly = 10;
          items.forEach(function(item, idx) {
            ctx.fillStyle = renkler[idx % renkler.length];
            ctx.fillRect(200, ly, 10, 10);
            ctx.fillStyle = '#374151'; ctx.font = '11px Segoe UI';
            ctx.fillText(item[0].substring(0,18) + ' ' + Math.round(item[1]).toLocaleString('tr-TR'), 215, ly+9);
            ly += 18;
          });
        }
      }
      var yil2 = new Date().getFullYear();
      var aylik2 = await api('/aylik?yil=' + yil2);
      if (aylik2) {
        var canvas2 = document.getElementById('trend-grafik');
        if (canvas2) {
          canvas2.width = canvas2.offsetWidth || 300; canvas2.height = 200;
          var ctx2 = canvas2.getContext('2d');
          var W=canvas2.width, H=200, SOL=50, SAG=10, UST=10, ALT=30;
          var son6 = aylik2.filter(function(d){return d.gelir>0||d.gider>0;}).slice(-6);
          if (son6.length >= 2) {
            var n=son6.length, gw=W-SOL-SAG, gh=H-UST-ALT;
            var vals=son6.flatMap(function(d){return [d.gelir,d.gider];});
            var maks=Math.max.apply(null,vals)*1.15||1;
            for(var i=0;i<=3;i++){
              var yv=i*maks/3, yp=UST+gh-yv/maks*gh;
              ctx2.strokeStyle='#e5e7eb'; ctx2.lineWidth=1;
              ctx2.beginPath(); ctx2.moveTo(SOL,yp); ctx2.lineTo(W-SAG,yp); ctx2.stroke();
              ctx2.fillStyle='#9ca3af'; ctx2.font='10px Segoe UI'; ctx2.textAlign='right';
              ctx2.fillText(yv>=1000?(yv/1000).toFixed(0)+'K':yv.toFixed(0), SOL-4, yp+4);
            }
            ctx2.strokeStyle='#10b981'; ctx2.lineWidth=2.5; ctx2.beginPath();
            son6.forEach(function(d,i){var x=SOL+i*gw/(n-1),y=UST+gh-d.gelir/maks*gh;i===0?ctx2.moveTo(x,y):ctx2.lineTo(x,y);}); ctx2.stroke();
            ctx2.strokeStyle='#ef4444'; ctx2.lineWidth=2.5; ctx2.beginPath();
            son6.forEach(function(d,i){var x=SOL+i*gw/(n-1),y=UST+gh-d.gider/maks*gh;i===0?ctx2.moveTo(x,y):ctx2.lineTo(x,y);}); ctx2.stroke();
            son6.forEach(function(d,i){
              var x=SOL+i*gw/(n-1);
              ctx2.fillStyle='#10b981'; ctx2.beginPath(); ctx2.arc(x,UST+gh-d.gelir/maks*gh,3,0,Math.PI*2); ctx2.fill();
              ctx2.fillStyle='#ef4444'; ctx2.beginPath(); ctx2.arc(x,UST+gh-d.gider/maks*gh,3,0,Math.PI*2); ctx2.fill();
              ctx2.fillStyle='#6b7280'; ctx2.font='9px Segoe UI'; ctx2.textAlign='center';
              ctx2.fillText(d.etiket.split(' ')[0], x, H-ALT+14);
            });
            ctx2.fillStyle='#10b981'; ctx2.fillRect(SOL,H-12,8,8);
            ctx2.fillStyle='#374151'; ctx2.font='10px Segoe UI'; ctx2.textAlign='left';
            ctx2.fillText('Tahsilat',SOL+12,H-5);
            ctx2.fillStyle='#ef4444'; ctx2.fillRect(SOL+70,H-12,8,8);
            ctx2.fillStyle='#374151'; ctx2.fillText('Gider',SOL+82,H-5);
          }
        }
      }
    } catch(e) { console.log('Grafik hatasi:', e); }
  }, 300);
}

async function aylikYenile() {
  const yil = parseInt(document.getElementById('aylik-yil')?.value) || new Date().getFullYear();
  const data = await api('/aylik?yil=' + yil);
  if (!data) return;

  const aktif = data.filter(d => d.gelir > 0 || d.gider > 0);
  const enIyi = aktif.length ? aktif.reduce((a,b) => b.net > a.net ? b : a) : null;
  const enKotu = aktif.length ? aktif.reduce((a,b) => b.net < a.net ? b : a) : null;
  const toplamNet = data.reduce((s,d) => s+d.net, 0);
  const ortNet = aktif.length ? toplamNet/aktif.length : 0;

  const ozet = document.getElementById('aylik-ozet');
  if (ozet) ozet.innerHTML = `
    <div class="kart"><div class="k-baslik">En İyi Ay</div>
      <div class="k-deger" style="color:var(--yesil);font-size:15px">${enIyi?enIyi.etiket:'-'}</div>
      <div style="font-size:13px;color:var(--yesil)">${enIyi?para(enIyi.net):''}</div></div>
    <div class="kart"><div class="k-baslik">En Kötü Ay</div>
      <div class="k-deger" style="color:var(--kirmizi);font-size:15px">${enKotu?enKotu.etiket:'-'}</div>
      <div style="font-size:13px;color:var(--kirmizi)">${enKotu?para(enKotu.net):''}</div></div>
    <div class="kart"><div class="k-baslik">Aylık Ort. Net Kâr</div>
      <div class="k-deger" style="color:var(--ana);font-size:16px">${para(ortNet)}</div></div>
    <div class="kart"><div class="k-baslik">Dönem Net Kârı</div>
      <div class="k-deger" style="color:${toplamNet>=0?'var(--yesil)':'var(--kirmizi)'};font-size:16px">${para(toplamNet)}</div></div>`;

  const tbody = document.getElementById('aylik-tablo');
  if (tbody) tbody.innerHTML = data.map(d=>`<tr>
    <td><strong>${d.etiket}</strong></td>
    <td style="color:var(--yesil)">${para(d.gelir)}</td>
    <td style="color:var(--kirmizi)">${para(d.gider)}</td>
    <td style="color:${d.net>=0?'var(--yesil)':'var(--kirmizi)'}"><strong>${para(d.net)}</strong></td>
  </tr>`).join('');

  // Canvas grafik
  setTimeout(() => {
    const canvas = document.getElementById('aylik-grafik');
    if (!canvas) return;
    canvas.width = canvas.offsetWidth || 600;
    canvas.height = 260;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const SOL=65, SAG=10, UST=10, ALT=36;
    const gw=W-SOL-SAG, gh=H-UST-ALT, n=data.length;
    ctx.clearRect(0,0,W,H);

    const vals = data.flatMap(d=>[d.gelir,d.gider,Math.abs(d.net)]).filter(v=>v>0);
    const maks = vals.length ? Math.max(...vals)*1.2 : 1;
    const minNet = Math.min(...data.map(d=>d.net),0);
    const yMin = minNet<0 ? minNet*1.2 : 0;
    const yAr = maks-yMin||1;
    const yP = v => UST+gh-(v-yMin)/yAr*gh;

    // Izgara
    for(let i=0;i<=4;i++){
      const yv=yMin+i*(maks-yMin)/4, yp=yP(yv);
      ctx.strokeStyle='#e5e7eb'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(SOL,yp); ctx.lineTo(W-SAG,yp); ctx.stroke();
      ctx.fillStyle='#9ca3af'; ctx.font='10px Segoe UI'; ctx.textAlign='right';
      ctx.fillText(Math.abs(yv)>=1000?(yv/1000).toFixed(0)+'K':yv.toFixed(0), SOL-3, yp+4);
    }
    if(yMin<0){
      ctx.strokeStyle='#9ca3af'; ctx.lineWidth=1; ctx.setLineDash([5,3]);
      ctx.beginPath(); ctx.moveTo(SOL,yP(0)); ctx.lineTo(W-SAG,yP(0)); ctx.stroke();
      ctx.setLineDash([]);
    }

    const grupW=gw/n, barW=Math.max(Math.min(grupW*0.28,16),3);
    const pts=[];
    for(let i=0;i<n;i++){
      const d=data[i], xm=SOL+i*grupW+grupW/2, y0=yP(0);
      if(d.gelir>0){ctx.fillStyle='#10b981';ctx.fillRect(xm-barW-1,Math.min(yP(d.gelir),y0),barW,Math.abs(yP(d.gelir)-y0));}
      if(d.gider>0){ctx.fillStyle='#ef4444';ctx.fillRect(xm+1,Math.min(yP(d.gider),y0),barW,Math.abs(yP(d.gider)-y0));}
      pts.push({x:xm,y:yP(d.net),v:d.net});
      ctx.fillStyle='#374151'; ctx.font='9px Segoe UI'; ctx.textAlign='center';
      ctx.fillText(d.etiket.split(' ')[0], xm, H-ALT+14);
    }
    if(pts.length>1){
      ctx.strokeStyle='#1a56db'; ctx.lineWidth=2; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      pts.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke();
    }
    pts.forEach(p=>{
      ctx.fillStyle=p.v>=0?'#057a55':'#c81e1e';
      ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill();
    });
  }, 100);
}

function hizliFiltre(tip) {
  const bugun = new Date();
  const bugunStr = bugun.toISOString().split('T')[0];
  let bas, bit;
  ['bugun','ay','yil','tumü'].forEach(t => {
    const btn = document.getElementById('hizli-'+t);
    if (btn) { btn.style.background = '#f1f5f9'; btn.style.color = 'var(--metin)'; btn.style.border = '1px solid var(--kenar)'; }
  });
  const aktif = document.getElementById('hizli-'+tip);
  if (aktif) { aktif.style.background = 'var(--ana)'; aktif.style.color = '#fff'; aktif.style.border = 'none'; }
  if (tip === 'bugun') { bas = bit = bugunStr; }
  else if (tip === 'ay') { bas = new Date(bugun.getFullYear(), bugun.getMonth(), 1).toISOString().split('T')[0]; bit = bugunStr; }
  else if (tip === 'yil') { bas = new Date(bugun.getFullYear(), 0, 1).toISOString().split('T')[0]; bit = bugunStr; }
  else { bas = '2020-01-01'; bit = bugunStr; }
  const basEl = document.getElementById('ozet-bas');
  const bitEl = document.getElementById('ozet-bit');
  if (basEl) basEl.value = bas;
  if (bitEl) bitEl.value = bit;
  ozetYenile();
}

function ozetSifirla() {
  const bugun = new Date();
  document.getElementById('ozet-bas').value = new Date(bugun.getFullYear(), 0, 1).toISOString().split('T')[0];
  document.getElementById('ozet-bit').value = bugun.toISOString().split('T')[0];
  ozetYenile();
}

function numuneFiltrele() {
  var numuneler = window._tumNumuneler || [];
  var bas = document.getElementById('numune-bas') ? document.getElementById('numune-bas').value : '';
  var bit = document.getElementById('numune-bit') ? document.getElementById('numune-bit').value : '';
  var tur = window._aktifNumuneTur2 || '';

  if (bas && bit) {
    numuneler = numuneler.filter(function(n) { return n.tarih >= bas && n.tarih <= bit; });
  }

  var toplamKdvli = 0, toplamAdet = 0;
  var isAdm = isAdmin();
  var rows = numuneler.map(function(n) {
    toplamKdvli += n.toplam_kdvli || 0;
    toplamAdet += n.adet || 0;
    var stl = n.durum === 'Tahsil Edildi' ? 'tahsil' : 'beklem';
    var caplar = n.caplar ? n.caplar.split(',').map(function(c){return 'φ'+c.trim();}).join(', ') : '';
    var h = '<td style="width:32px"><input type="checkbox" class="numune-cb" data-id="'+n.id+'"></td>' +
      '<td>'+n.id+'</td><td>'+n.tarih+'</td><td>'+(n.musteri_adi||'')+'</td>' +
      '<td>'+(n.yibf||'')+'</td><td>'+(n.belediye||'')+'</td><td>'+(n.blok||'')+'</td><td>'+(n.kat||'')+'</td>';
    if (tur === 'Taze Beton') h += '<td>'+(n.m3||'')+'</td><td>'+(n.beton_sinifi||'')+'</td>';
    if (tur === 'Celik') h += '<td>'+caplar+'</td>';
    if (tur === 'Karot') h += '<td>'+(n.is_adi||'')+'</td>';
    h += '<td>'+n.adet+'</td><td>'+para(n.birim_fiyat)+'</td>' +
      '<td>%'+(n.kdv_oran||0)+'</td><td>'+para(n.toplam)+'</td><td>'+para(n.toplam_kdvli)+'</td>' +
      '<td><span class="badge '+(n.durum==='Tahsil Edildi'?'badge-yesil':'badge-turuncu')+'">'+n.durum+'</span></td>';
    if (isAdm) h += '<td><button class="btn btn-kirmizi btn-sm" onclick="numuneSil('+n.id+')">Sil</button></td>';
    return '<tr class="'+stl+'" data-id="'+n.id+'">'+h+'</tr>';
  }).join('');

  var tbody = document.getElementById('numune-tbody');
  if (tbody) tbody.innerHTML = rows;
  var topEl = document.getElementById('numune-toplam');
  if (topEl) topEl.textContent = toplamAdet + ' adet | KDVli: ' + para(toplamKdvli);
}

function numuneHesap() {
  const a = +document.getElementById('n-adet')?.value || 0;
  const f = +document.getElementById('n-fiyat')?.value || 0;
  const k = +document.getElementById('n-kdv')?.value || 0;
  const kdvsiz = a * f;
  const kdvli = kdvsiz * (1 + k/100);
  const el = document.getElementById('n-hesap');
  if (el) el.textContent = `${a} × ${f.toLocaleString('tr-TR')} ₺ = KDVsiz: ${kdvsiz.toLocaleString('tr-TR')} ₺ | KDVli: ${kdvli.toLocaleString('tr-TR')} ₺`;
}

function giderYenile() {
  const bas = document.getElementById('gider-bas')?.value || '';
  const bit = document.getElementById('gider-bit')?.value || '';
  let giderler = window._tumGiderler || [];
  if (bas && bit) giderler = giderler.filter(g => g.tarih >= bas && g.tarih <= bit);
  window._filtreliGiderler = giderler;

  // Kategori buton toplamlari guncelle
  const katlar = window._giderKatlar || [];
  katlar.forEach(k => {
    if (k.id === 'tumu') return;
    const kat_giderler = giderler.filter(g => g.kategori && g.kategori.includes(k.label));
    const toplam = kat_giderler.reduce((s,g) => s+(g.tutar||0), 0);
    const btn = document.getElementById('gkbt-'+k.id);
    if (btn) {
      const lbl = k.emoji + ' ' + k.label + (toplam > 0 ? ' · ' + para(toplam) : '');
      btn.innerHTML = lbl;
    }
  });
  // Tumu butonu
  const tumToplam = giderler.reduce((s,g) => s+(g.tutar||0), 0);
  const tumBtn = document.getElementById('gkbt-tumu');
  if (tumBtn) tumBtn.innerHTML = '📊 Tümü · ' + para(tumToplam);

  giderFiltrele(window._aktifGiderKat || 'tumu');
}

function giderFiltrele(katId) {
  window._aktifGiderKat = katId;
  const giderler = window._filtreliGiderler || window._tumGiderler || [];
  const katlar = window._giderKatlar || [];
  // Buton stilleri
  katlar.forEach(k => {
    const btn = document.getElementById('gkbt-'+k.id);
    if (!btn) return;
    if (k.id === katId) {
      btn.style.background = k.renk === 'var(--ana)' ? 'var(--ana)' : k.renk;
      btn.style.color = '#fff';
      btn.style.borderColor = k.renk === 'var(--ana)' ? 'var(--ana)' : k.renk;
    } else {
      btn.style.background = '#fff';
      btn.style.color = '#374151';
      btn.style.borderColor = '#e5e7eb';
    }
  });

  const filtreli = katId === 'tumu' ? giderler : giderler.filter(g => {
    const k = katlar.find(k => k.id === katId);
    return k && g.kategori && g.kategori.includes(k.label);
  });

  const toplam = filtreli.reduce((s,g) => s+(g.tutar||0), 0);
  const lbl = katlar.find(k=>k.id===katId);
  const isAdm = isAdmin();

  const lblEl = document.getElementById('gider-filtre-lbl');
  if (lblEl) lblEl.textContent = (lbl ? lbl.emoji+' '+lbl.label : '') + ' — ' + filtreli.length + ' kayıt';
  const tot = document.getElementById('gider-toplam');
  if (tot) tot.textContent = para(toplam);

  // Plaka kartlari
  const plakaToplam = {};
  filtreli.filter(g=>g.arac).forEach(g => {
    plakaToplam[g.arac] = (plakaToplam[g.arac]||0)+(g.tutar||0);
  });
  const plakaDiv = document.getElementById('gider-plaka-kartlar');
  if (plakaDiv) {
    if (Object.keys(plakaToplam).length) {
      plakaDiv.innerHTML = '<div style="font-size:12px;color:var(--ikincil);margin-bottom:6px">🚗 Araç Bazlı</div>' +
        '<div class="kart-grid kart-grid-4">' +
        Object.entries(plakaToplam).sort((a,b)=>b[1]-a[1]).map(([p,t])=>
          '<div class="kart" onclick="giderFiltreleArac(\''+p+'\')" style="cursor:pointer">' +
          '<div class="k-baslik">🚗 '+p+'</div>' +
          '<div class="k-deger" style="color:var(--kirmizi);font-size:16px">'+para(t)+'</div></div>'
        ).join('') + '</div>';
    } else plakaDiv.innerHTML = '';
  }

  const tbody = document.getElementById('gider-tbody');
  if (tbody) tbody.innerHTML = filtreli.map(g =>
    '<tr><td>'+g.tarih+'</td><td>'+(g.kategori||'')+'</td><td>'+(g.aciklama||'')+'</td>' +
    '<td>'+(g.arac?'<span style="background:#f1f5f9;padding:2px 8px;border-radius:6px;font-size:12px">'+g.arac+'</span>':'')+'</td>' +
    '<td style="color:var(--kirmizi);font-weight:600">'+para(g.tutar)+'</td>' +
    (isAdm?'<td><button class="btn btn-kirmizi btn-sm" onclick="giderSil('+g.id+')">Sil</button></td>':'') +
    '</tr>'
  ).join('');
}

function giderFiltreleArac(plaka) {
  const giderler = window._tumGiderler || [];
  const filtreli = giderler.filter(g => g.arac === plaka);
  const toplam = filtreli.reduce((s,g) => s+(g.tutar||0), 0);
  const isAdm = isAdmin();
  const tbody = document.getElementById('gider-tbody');
  if (tbody) tbody.innerHTML = filtreli.map(g => `<tr>
    <td>${g.tarih}</td><td>${g.kategori||''}</td><td>${g.aciklama||''}</td>
    <td><strong>${g.arac||''}</strong></td>
    <td style="color:var(--kirmizi);font-weight:600">${para(g.tutar)}</td>
    ${isAdm ? `<td><button class="btn btn-kirmizi btn-sm" onclick="giderSil(${g.id})">Sil</button></td>` : ''}
  </tr>`).join('');
  const tot = document.getElementById('gider-toplam');
  if (tot) tot.textContent = `🚗 ${plaka} · ${para(toplam)}`;
  // Tum kategori butonlarini sifirla
  (window._giderKatlar||[]).forEach(k => {
    const btn = document.getElementById('gkbt-'+k.id);
    if (btn) { btn.style.background='#fff'; btn.style.color='#374151'; btn.style.borderColor='#e5e7eb'; }
  });
}

function giderKatSec(id, label, renk) {
  document.querySelectorAll('[id^="gikat-"]').forEach(b => {
    b.style.background = '#f8fafc';
    b.style.color = '#374151';
    b.style.border = '2px solid #e5e7eb';
  });
  const btn = document.getElementById('gikat-'+id);
  if (btn) { btn.style.background = renk; btn.style.color = '#fff'; btn.style.border = '2px solid '+renk; }

  const labels = {benzin:'Benzin / Mazot', sanayi:'Sanayi Gideri', maas:'Personel Maaşları',
    malzeme:'Malzeme Gideri', fatura:'Fatura Giderleri', diger:'Diğer'};
  document.getElementById('gi-kat').value = labels[id] || label;

  const aracDiv = document.getElementById('gi-arac-div');
  if (aracDiv) aracDiv.style.display = (id === 'benzin' || id === 'sanayi') ? '' : 'none';
  const lbl = document.getElementById('gi-arac-lbl');
  if (lbl) lbl.textContent = id === 'sanayi' ? 'Araç / Makine' : 'Araç Plakası';
}

function aramaAc() {
  document.getElementById('arama-overlay').style.display = 'block';
  document.getElementById('arama-panel').style.display = 'block';
  document.getElementById('arama-input').focus();
  document.getElementById('arama-sonuclar').innerHTML = '';
}

function aramaKapat() {
  document.getElementById('arama-overlay').style.display = 'none';
  document.getElementById('arama-panel').style.display = 'none';
  document.getElementById('arama-input').value = '';
}

async function aramaYap() {
  const q = document.getElementById('arama-input').value.trim().toLowerCase();
  const el = document.getElementById('arama-sonuclar');
  if (q.length < 2) { el.innerHTML = '<p style="color:var(--ikincil);padding:8px">En az 2 karakter girin</p>'; return; }

  const [musteriler, numuneler] = await Promise.all([api('/musteriler'), api('/numuneler')]);
  const sonuclar = [];

  // Musteri ara
  (musteriler||[]).filter(m =>
    m.firma.toLowerCase().includes(q) || (m.belediye||'').toLowerCase().includes(q) || (m.telefon||'').includes(q)
  ).forEach(m => sonuclar.push({tip:'Müşteri', baslik: m.firma, alt: `${m.tip} | ${m.belediye||''}`, sayfa:'musteri_detay', id: m.id}));

  // Numune ara
  (numuneler||[]).filter(n =>
    (n.yibf||'').toLowerCase().includes(q) ||
    (n.musteri_adi||'').toLowerCase().includes(q) ||
    (n.belediye||'').toLowerCase().includes(q) ||
    (n.blok||'').toLowerCase().includes(q)
  ).slice(0,15).forEach(n => sonuclar.push({
    tip: n.tur, baslik: `${n.musteri_adi||'?'} - ${n.yibf||'YİBF yok'}`,
    alt: `${n.tarih} | ${n.belediye||''} ${n.blok||''} ${n.kat||''} | ${para(n.toplam_kdvli)}`,
    sayfa: n.tur==='Taze Beton'?'taze_beton':n.tur==='Celik'?'celik':'karot'
  }));

  if (!sonuclar.length) { el.innerHTML = '<p style="color:var(--ikincil);padding:12px">Sonuç bulunamadı</p>'; return; }

  el.innerHTML = sonuclar.map(s => `
    <div onclick="aramaKapat();sayfaGit('${s.sayfa}')" style="padding:12px 16px;border-bottom:1px solid var(--kenar);cursor:pointer;border-radius:8px" 
      onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background=''">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:11px;padding:2px 8px;background:var(--kenar);border-radius:99px;color:var(--ikincil)">${s.tip}</span>
        <strong style="font-size:14px">${s.baslik}</strong>
      </div>
      <div style="font-size:12px;color:var(--ikincil);margin-top:4px">${s.alt}</div>
    </div>`).join('');
}

// Ctrl+K ile arama aç
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); aramaAc(); }
});

  a.href = URL.createObjectURL(blob);

  a.click();

async function yedekYukle() {
  const inp = document.getElementById('yedek-dosya');
  if (!inp || !inp.files.length) { alert('Lütfen bir yedek dosyası seçin!'); return; }
  const dosya = inp.files[0];
  if (!confirm('Yedek dosyasındaki veriler mevcut sistemine eklenecek. Devam etmek istiyor musunuz?\n\nDosya: ' + dosya.name)) return;
  
  try {
    const metin = await dosya.text();
    const veri = JSON.parse(metin);
    if (!veri.versiyon) {
      if (!confirm('Bu dosya geçerli bir yedek dosyasına benzemiyor. Yine de denemek ister misiniz?')) return;
    }
    
    const r = await fetch(API + '/yedek-yukle', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer '+token},
      body: JSON.stringify(veri)
    });
    if (!r.ok) { alert('Geri yükleme başarısız!'); return; }
    const sonuc = await r.json();
    let mesaj = '✅ Yedek geri yüklendi!\n\nEklenen kayıtlar:\n';
    for (const [tablo, sayi] of Object.entries(sonuc.eklenen||{})) {
      if (sayi > 0) mesaj += '  • ' + tablo + ': ' + sayi + ' kayıt\n';
    }
    if (sonuc.hatalar && sonuc.hatalar.length) {
      mesaj += '\n⚠️ Bazı kayıtlar zaten mevcut olabilir veya hata oluştu.';
    }
    alert(mesaj);
    inp.value = '';
  } catch(e) {
    alert('Dosya okunamadı: ' + e.message);
  }
}

async function aylikRaporExcel() {
  const yil = document.getElementById('rapor-yil')?.value || new Date().getFullYear();
  const data = await api('/aylik?yil=' + yil);
  if (!data) return;

  let csv = '﻿';
  csv += `LABİN YAPI LABORATUVARI - AYLIK RAPOR ${yil}

`;
  csv += 'Ay,Tahsilat,Gider,Net Kâr\n';
  data.forEach(d => { csv += `${d.etiket},${d.gelir},${d.gider},${d.net}
`; });
  csv += `TOPLAM,${data.reduce((s,d)=>s+d.gelir,0)},${data.reduce((s,d)=>s+d.gider,0)},${data.reduce((s,d)=>s+d.net,0)}
`;

  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `aylik_rapor_${yil}.csv`;
  a.click();
}

async function sonSilmeGeriAl() {
  const s = window._sonSilinenKayit;
  if (!s) { alert('Geri alınacak kayıt yok'); return; }
  if (!confirm('Son silme işlemini geri almak istiyor musunuz?')) return;

  let r = null;
  if (s.data) {
    // Veriyi tekrar ekle
    const d = s.data;
    delete d.id; delete d.olusturma;
    r = await api(s.endpoint, 'POST', d);
  }

  if (r) {
    alert('Kayıt geri yüklendi!');
    window._sonSilinenKayit = null;
    sayfaGit(aktifSayfa);
  } else {
    alert('Geri alma başarısız oldu');
  }
}

// ── GERİ AL / İLERİ AL SİSTEMİ ───────────────────────────────────────────────
window._gecmis = [];
window._gecmisPos = -1;

function gecmiseEkle(islem) {
  // Ileri alma gecmisini temizle
  window._gecmis = window._gecmis.slice(0, window._gecmisPos + 1);
  window._gecmis.push(islem);
  if (window._gecmis.length > 50) window._gecmis.shift();
  window._gecmisPos = window._gecmis.length - 1;
  gecmisButonGuncelle();
}

function gecmisButonGuncelle() {
  const geri = document.getElementById('btn-geri');
  const ileri = document.getElementById('btn-ileri');
  if (geri) geri.style.color = window._gecmisPos >= 0 ? '#e2e8f0' : '#475569';
  if (ileri) ileri.style.color = window._gecmisPos < window._gecmis.length - 1 ? '#e2e8f0' : '#475569';
}

async function geriAl() {
  if (window._gecmisPos < 0) { alert('Geri alınacak işlem yok'); return; }
  const islem = window._gecmis[window._gecmisPos];
  try {
    if (islem.tip === 'ekle') {
      // Eklenen kaydi sil
      await api(islem.endpoint + '/' + islem.id, 'DELETE');
    } else if (islem.tip === 'sil') {
      // Silinen kaydi geri yukle (cop kutusundan)
      if (islem.copId) await api('/cop-kutusu/' + islem.copId + '/geri-yukle', 'POST');
    }
    window._gecmisPos--;
    gecmisButonGuncelle();
    sayfaGit(aktifSayfa);
  } catch(e) { alert('Geri alma başarısız'); }
}

async function ileriAl() {
  if (window._gecmisPos >= window._gecmis.length - 1) { alert('İleri alınacak işlem yok'); return; }
  window._gecmisPos++;
  const islem = window._gecmis[window._gecmisPos];
  try {
    if (islem.tip === 'ekle') {
      // Tekrar ekle
      const r = await api(islem.endpoint, 'POST', islem.data);
      if (r && r.id) islem.id = r.id;
    } else if (islem.tip === 'sil') {
      // Tekrar sil
      if (islem.silEndpoint) await api(islem.silEndpoint, 'DELETE');
    }
    gecmisButonGuncelle();
    sayfaGit(aktifSayfa);
  } catch(e) { alert('İleri alma başarısız'); }
}

// Ctrl+Z ve Ctrl+Y kisayollari
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); geriAl(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); ileriAl(); }
});

function copTumunuSec(checked) {
  document.querySelectorAll('.cop-cb').forEach(cb => cb.checked = checked);
}

async function copGeriYukle() {
  const secili = [...document.querySelectorAll('.cop-cb:checked')].map(cb => +cb.value);
  if (!secili.length) { alert('Lütfen kayıt seçin'); return; }
  if (!confirm(secili.length + ' kayıt geri yüklenecek. Onaylıyor musunuz?')) return;
  for (const id of secili) { await api('/cop-kutusu/' + id + '/geri-yukle', 'POST'); }
  alert('Kayıtlar geri yüklendi!');
  sayfalar.cop_kutusu();
}

async function copKaliciSil() {
  const secili = [...document.querySelectorAll('.cop-cb:checked')].map(cb => +cb.value);
  if (!secili.length) { alert('Lütfen kayıt seçin'); return; }
  if (!confirm(secili.length + ' kayıt kalıcı olarak silinecek! Bu işlem geri alınamaz.')) return;
  for (const id of secili) { await api('/cop-kutusu/' + id, 'DELETE'); }
  sayfalar.cop_kutusu();
}

async function copTekGeriYukle(id) {
  if (!confirm('Bu kaydı geri yüklemek istiyor musunuz?')) return;
  const r = await api('/cop-kutusu/' + id + '/geri-yukle', 'POST');

}
