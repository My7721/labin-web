<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labin Yapı Lab</title>
<meta name="application-name" content="Labin Yapı Lab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Labin Lab">
<meta name="theme-color" content="#1e3a5f">
<link rel="manifest" href="/manifest.json">
<style>
:root {
  --ana: #1a56db; --yesil: #057a55; --kirmizi: #c81e1e;
  --turuncu: #d97706; --mor: #6c2bd9;
  --bg: #f3f4f6; --kart: #fff; --metin: #111827;
  --ikincil: #6b7280; --kenar: #e5e7eb;
  --sidebar: #1e3a5f; --sidebar2: #2d5280;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--metin); }
#app { display: flex; min-height: 100vh; }
/* SIDEBAR */
#sidebar {
  width: 220px; background: var(--sidebar); color: #fff;
  display: flex; flex-direction: column; min-height: 100vh;
  position: fixed; left: 0; top: 0; bottom: 0; z-index: 100;
  transition: transform .3s;
}
#sidebar .logo { padding: 24px 16px 8px; font-size: 20px; font-weight: 700; }
#sidebar .logo-sub { padding: 0 16px 16px; font-size: 12px; color: #94a3b8; }
#sidebar nav a {
  display: block; padding: 10px 16px; color: #cbd5e1; text-decoration: none;
  font-size: 14px; border-radius: 8px; margin: 2px 8px; transition: background .2s;
}
#sidebar nav a:hover, #sidebar nav a.aktif { background: var(--sidebar2); color: #fff; }
#sidebar .sidebar-alt {
  margin-top: auto; padding: 8px;
  display: flex; flex-direction: column; gap: 4px;
}
#sidebar .sidebar-alt a, #sidebar .sidebar-alt button {
  display: block; width: 100%; padding: 8px 12px;
  color: #94a3b8; text-decoration: none; font-size: 12px;
  background: transparent; border: none; cursor: pointer;
  border-radius: 6px; text-align: left;
}
#sidebar .sidebar-alt a:hover, #sidebar .sidebar-alt button:hover { background: var(--sidebar2); color: #fff; }
#sidebar .cikis-btn {
  background: #7f1d1d !important; color: #fca5a5 !important;
  font-weight: 600 !important;
}
#sidebar .kullanici-bilgi {
  padding: 8px 12px; font-size: 11px; color: #64748b;
  border-top: 1px solid #334e6e; margin-top: 4px;
}
/* ANA ICERIK */
#icerik { margin-left: 220px; flex: 1; padding: 24px; min-height: 100vh; }
/* KARTLAR */
.kart-grid { display: grid; gap: 12px; margin-bottom: 16px; }
.kart-grid-4 { grid-template-columns: repeat(4, 1fr); }
.kart-grid-3 { grid-template-columns: repeat(3, 1fr); }
.kart-grid-2 { grid-template-columns: repeat(2, 1fr); }
@media(max-width:900px) {
  .kart-grid-4,.kart-grid-3 { grid-template-columns: repeat(2,1fr); }
  #icerik { padding: 16px; }
}
@media(max-width:600px) {
  .kart-grid-4,.kart-grid-3,.kart-grid-2 { grid-template-columns: repeat(2,1fr); }
  .kart-grid-4.tek { grid-template-columns: 1fr; }
  #sidebar { transform: translateX(-220px); transition: transform .3s; }
  #sidebar.acik { transform: translateX(0); }
  #icerik { margin-left: 0 !important; padding: 12px; }
  #mob-menu-btn { display: flex !important; }
  .sayfa-baslik { font-size: 18px; margin-bottom: 12px; }
  .k-deger { font-size: 16px !important; }
  .k-baslik { font-size: 11px !important; }
  table { font-size: 12px; }
  th, td { padding: 7px 8px; }
  .toolbar { gap: 6px; }
  .btn { padding: 7px 12px; font-size: 12px; }
  .modal { padding: 16px; width: 95%; }
  .form-row, .form-row-3 { grid-template-columns: 1fr; }
  .tablo-wrap { border-radius: 8px; }
}
.kart {
  background: var(--kart); border-radius: 12px;
  border: 1px solid var(--kenar); padding: 16px;
  cursor: pointer; transition: box-shadow .2s;
}
.kart:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
.kart .k-baslik { font-size: 12px; color: var(--ikincil); margin-bottom: 4px; }
.kart .k-deger { font-size: 20px; font-weight: 700; }
/* TABLO */
.tablo-wrap { background: var(--kart); border-radius: 12px; border: 1px solid var(--kenar); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #f8fafc; padding: 10px 12px; text-align: left; font-weight: 600; white-space: nowrap; border-bottom: 1px solid var(--kenar); }
td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; white-space: nowrap; }
tr:hover td { background: #f8fafc; }
tr.tahsil td { color: var(--yesil); background: #f0fdf4; }
tr.beklem td { color: var(--metin); }
/* BUTONLAR */
.btn { padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: opacity .2s; }
.btn:hover { opacity: .85; }
.btn-ana { background: var(--ana); color: #fff; }
.btn-yesil { background: var(--yesil); color: #fff; }
.btn-kirmizi { background: var(--kirmizi); color: #fff; }
.btn-gri { background: #374151; color: #fff; }
.btn-sm { padding: 5px 12px; font-size: 12px; }
/* TOOLBAR */
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar input, .toolbar select {
  padding: 7px 12px; border-radius: 8px; border: 1px solid var(--kenar);
  font-size: 13px; outline: none;
}
/* FORM */
.form-grup { margin-bottom: 12px; }
.form-grup label { display: block; font-size: 13px; color: var(--ikincil); margin-bottom: 4px; }
.form-grup input, .form-grup select, .form-grup textarea {
  width: 100%; padding: 9px 12px; border: 1px solid var(--kenar);
  border-radius: 8px; font-size: 14px; font-family: inherit; outline: none;
}
.form-grup input:focus, .form-grup select:focus { border-color: var(--ana); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: center; z-index: 1000;
}
.modal {
  background: #fff; border-radius: 16px; padding: 28px;
  width: 90%; max-width: 560px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
.modal h3 { font-size: 18px; margin-bottom: 20px; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
/* LOGIN */
#login-screen {
  min-height: 100vh; background: var(--sidebar);
  display: flex; align-items: center; justify-content: center;
}
.login-kart {
  background: #162d4a; border-radius: 16px; padding: 40px;
  width: 380px; text-align: center;
}
.login-kart .logo { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 4px; }
.login-kart .logo-sub { color: #94a3b8; font-size: 13px; margin-bottom: 28px; }
.login-kart input {
  width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155;
  background: #1e293b; color: #fff; font-size: 14px; margin-bottom: 12px; outline: none;
}
.login-kart button {
  width: 100%; padding: 13px; background: var(--ana); color: #fff;
  border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer;
}
.login-kart .hata { color: #ef4444; font-size: 13px; margin-top: 8px; }
/* OZET METINLER */
.sayfa-baslik { font-size: 24px; font-weight: 700; margin-bottom: 20px; }
.section-baslik { font-size: 15px; font-weight: 600; margin: 16px 0 8px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
.badge-yesil { background: #dcfce7; color: var(--yesil); }
.badge-kirmizi { background: #fee2e2; color: var(--kirmizi); }
.badge-turuncu { background: #fef3c7; color: var(--turuncu); }
#mob-menu-btn { display: none; position: fixed; top: 12px; left: 12px; z-index: 200; background: var(--sidebar); color: #fff; border: none; border-radius: 8px; padding: 8px 12px; font-size: 20px; cursor: pointer; }
.menu-grup-baslik {
  padding: 10px 14px 5px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-top: 6px;
  border-top: 1px solid rgba(255,255,255,.06);
}
.menu-grup-baslik.tiklanabilir {
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  user-select: none;
  transition: color .15s;
}
.menu-grup-baslik.tiklanabilir:hover { color: #e2e8f0; }
.menu-grup-icerik { overflow: hidden; transition: max-height .25s ease; }
.menu-grup-icerik.kapali { max-height: 0 !important; }
</style>
</head>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
// Backend adresi - ayni sunucudan geliyorsa bos birak
const API = (window.location.protocol === 'file:' || window.location.hostname === 'localhost')
  ? 'http://localhost:8000'
  : '';  // Railway'de ayni origin, bos birak

let token = localStorage.getItem('token');
let aktifKullanici = JSON.parse(localStorage.getItem('kullanici') || 'null');
let aktifSayfa = 'ozet';

// ── API HELPER ────────────────────────────────────────────────────────────────
async function api(yol, method = 'GET', body = null) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
  };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + yol, opts);
  if (r.status === 401) { cikisYap(); return null; }
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    alert(err.detail || 'Bir hata oluştu');
    return null;
  }
  return r.json();
}

const para = n => new Intl.NumberFormat('tr-TR', {minimumFractionDigits:2}).format(n||0) + ' ₺';
const isAdmin = () => aktifKullanici?.rol === 'admin';
const tarihBugun = () => new Date().toISOString().split('T')[0];

// ── GİRİŞ / ÇIKIŞ ────────────────────────────────────────────────────────────
async function girisYap() {
  const ku = document.getElementById('giris-id').value.trim();
  const sf = document.getElementById('giris-sifre').value.trim();
  const r = await fetch(API + '/giris', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({kullanici_adi: ku, sifre: sf})
  });
  if (!r.ok) {
    document.getElementById('giris-hata').textContent = 'Kullanıcı adı veya şifre yanlış!';
    return;
  }
  const d = await r.json();
  token = d.token;
  aktifKullanici = d.kullanici;
  localStorage.setItem('token', token);
  localStorage.setItem('kullanici', JSON.stringify(aktifKullanici));
  baslatUygulama();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') girisYap();
});

function cikisYap() {
  if (!confirm('Çıkış yapmak istiyor musunuz?')) return;
  localStorage.clear();
  location.reload();
}

function toggleMenu() {
  const s = document.getElementById('sidebar');
  s.classList.toggle('acik');
}

function menuGrupToggle(id) {
  const el = document.getElementById(id);
  const ok = document.getElementById(id + '-ok');
  if (!el) return;
  const kapali = el.classList.contains('kapali');
  if (kapali) {
    el.classList.remove('kapali');
    el.style.maxHeight = '300px';
    if (ok) ok.style.transform = 'rotate(0deg)';
  } else {
    el.classList.add('kapali');
    el.style.maxHeight = '0';
    if (ok) ok.style.transform = 'rotate(-90deg)';
  }
}
// Sayfa degisince mobilde menüyü kapat
const _eskiSayfaGit = sayfaGit;
// Icerik tiklaninca menüyü kapat (mobilde)
document.addEventListener('click', function(e) {
  if (window.innerWidth <= 600) {
    const sidebar = document.getElementById('sidebar');
    const btn = document.getElementById('mob-menu-btn');
    if (!sidebar.contains(e.target) && !btn.contains(e.target)) {
      sidebar.classList.remove('acik');
    }
  }
});

// ── UYGULAMA BAŞLAT ───────────────────────────────────────────────────────────
function baslatUygulama() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  const kb = document.getElementById('kullanici-bilgi');
  kb.innerHTML = `<strong>${aktifKullanici.ad}</strong><br>[${aktifKullanici.rol.toUpperCase()}]`;

  // Son guncelleme tarihini goster
  async function sonGuncellemeGoster() {
    try {
      const r = await api('/son-guncelleme');
      if (r) {
        const el = document.getElementById('son-guncelleme-lbl');
        if (el) el.textContent = 'Son giriş: ' + r.son_guncelleme;
      }
    } catch(e) {}
  }
  sonGuncellemeGoster();
  setInterval(sonGuncellemeGoster, 60000);

  // Son guncelleme tarihini goster
  async function sonGuncellemeGoster() {
    const r = await api('/son-guncelleme');
    if (r) {
      const el = document.getElementById('son-guncelleme-lbl');
      if (el) el.textContent = 'Son giriş: ' + r.son_guncelleme;
    }
  }
  sonGuncellemeGoster();
  // Her 60 saniyede bir guncelle

async function sayfaGit(id) {
  aktifSayfa = id;
  document.querySelectorAll('#nav a').forEach(a => a.classList.remove('aktif'));
  const el = document.getElementById('menu-'+id);
  if (el) el.classList.add('aktif');
  // Mobilde menuyu kapat
  if (window.innerWidth <= 600) {
    document.getElementById('sidebar')?.classList.remove('acik');
  }
  const ic = document.getElementById('sayfa-icerik');
  ic.innerHTML = '<p style="color:var(--ikincil);padding:40px">Yükleniyor...</p>';
  await sayfalar[id]?.();
}

async function aylikYenile() {
  const yil = parseInt(document.getElementById('aylik-yil')?.value) || new Date().getFullYear();
  const data = await api('/aylik?yil=' + yil);
  if (!data) return;

  const aktif = data.filter(d => d.gelir > 0 || d.gider > 0);
  const enIyi = aktif.length ? aktif.reduce((a,b) => b.net > a.net ? b : a) : null;
  const enKotu = aktif.length ? aktif.reduce((a,b) => b.net < a.net ? b : a) : null;
  const toplamNet = data.reduce((s,d) => s+d.net, 0);
  const ortNet = aktif.length ? toplamNet/aktif.length : 0;

  const ozet = document.getElementById('aylik-ozet');
  if (ozet) ozet.innerHTML = `
    <div class="kart"><div class="k-baslik">En İyi Ay</div>
      <div class="k-deger" style="color:var(--yesil);font-size:15px">${enIyi?enIyi.etiket:'-'}</div>
      <div style="font-size:13px;color:var(--yesil)">${enIyi?para(enIyi.net):''}</div></div>
    <div class="kart"><div class="k-baslik">En Kötü Ay</div>
      <div class="k-deger" style="color:var(--kirmizi);font-size:15px">${enKotu?enKotu.etiket:'-'}</div>
      <div style="font-size:13px;color:var(--kirmizi)">${enKotu?para(enKotu.net):''}</div></div>
    <div class="kart"><div class="k-baslik">Aylık Ort. Net Kâr</div>
      <div class="k-deger" style="color:var(--ana);font-size:16px">${para(ortNet)}</div></div>
    <div class="kart"><div class="k-baslik">Dönem Net Kârı</div>
      <div class="k-deger" style="color:${toplamNet>=0?'var(--yesil)':'var(--kirmizi)'};font-size:16px">${para(toplamNet)}</div></div>`;

  const tbody = document.getElementById('aylik-tablo');
  if (tbody) tbody.innerHTML = data.map(d=>`<tr>
    <td><strong>${d.etiket}</strong></td>
    <td style="color:var(--yesil)">${para(d.gelir)}</td>
    <td style="color:var(--kirmizi)">${para(d.gider)}</td>
    <td style="color:${d.net>=0?'var(--yesil)':'var(--kirmizi)'}"><strong>${para(d.net)}</strong></td>
  </tr>`).join('');

  // Canvas grafik
  setTimeout(() => {
    const canvas = document.getElementById('aylik-grafik');
    if (!canvas) return;
    canvas.width = canvas.offsetWidth || 600;
    canvas.height = 260;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const SOL=65, SAG=10, UST=10, ALT=36;
    const gw=W-SOL-SAG, gh=H-UST-ALT, n=data.length;
    ctx.clearRect(0,0,W,H);

    const vals = data.flatMap(d=>[d.gelir,d.gider,Math.abs(d.net)]).filter(v=>v>0);
    const maks = vals.length ? Math.max(...vals)*1.2 : 1;
    const minNet = Math.min(...data.map(d=>d.net),0);
    const yMin = minNet<0 ? minNet*1.2 : 0;
    const yAr = maks-yMin||1;
    const yP = v => UST+gh-(v-yMin)/yAr*gh;

    // Izgara
    for(let i=0;i<=4;i++){
      const yv=yMin+i*(maks-yMin)/4, yp=yP(yv);
      ctx.strokeStyle='#e5e7eb'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(SOL,yp); ctx.lineTo(W-SAG,yp); ctx.stroke();
      ctx.fillStyle='#9ca3af'; ctx.font='10px Segoe UI'; ctx.textAlign='right';
      ctx.fillText(Math.abs(yv)>=1000?(yv/1000).toFixed(0)+'K':yv.toFixed(0), SOL-3, yp+4);
    }
    if(yMin<0){
      ctx.strokeStyle='#9ca3af'; ctx.lineWidth=1; ctx.setLineDash([5,3]);
      ctx.beginPath(); ctx.moveTo(SOL,yP(0)); ctx.lineTo(W-SAG,yP(0)); ctx.stroke();
      ctx.setLineDash([]);
    }

    const grupW=gw/n, barW=Math.max(Math.min(grupW*0.28,16),3);
    const pts=[];
    for(let i=0;i<n;i++){
      const d=data[i], xm=SOL+i*grupW+grupW/2, y0=yP(0);
      if(d.gelir>0){ctx.fillStyle='#10b981';ctx.fillRect(xm-barW-1,Math.min(yP(d.gelir),y0),barW,Math.abs(yP(d.gelir)-y0));}
      if(d.gider>0){ctx.fillStyle='#ef4444';ctx.fillRect(xm+1,Math.min(yP(d.gider),y0),barW,Math.abs(yP(d.gider)-y0));}
      pts.push({x:xm,y:yP(d.net),v:d.net});
      ctx.fillStyle='#374151'; ctx.font='9px Segoe UI'; ctx.textAlign='center';
      ctx.fillText(d.etiket.split(' ')[0], xm, H-ALT+14);
    }
    if(pts.length>1){
      ctx.strokeStyle='#1a56db'; ctx.lineWidth=2; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      pts.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke();
    }
    pts.forEach(p=>{
      ctx.fillStyle=p.v>=0?'#057a55':'#c81e1e';
      ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill();
    });
  }, 100);
}

      <div class="form-grup"><label>Beton Sınıfı</label>
        <select id="n-sinif">${['C16','C20','C25','C30','C35','C40','C45','C50'].map(s=>`<option>${s}</option>`).join('')}</select>
      </div>
    </div>` : ''}
    ${tur==='Celik' ? `<div class="form-grup"><label>φ Çap Seçimi</label>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${caplar.map(c=>`<label style="display:flex;align-items:center;gap:4px;cursor:pointer">
          <input type="checkbox" value="${c}" class="cap-cb"> φ${c}</label>`).join('')}
      </div></div>` : ''}
    <div class="form-row-3">
      <div class="form-grup"><label>Adet *</label><input type="number" id="n-adet" value="1" oninput="numuneHesap()"></div>
      <div class="form-grup"><label>Birim Fiyat</label><input type="number" id="n-fiyat" value="0" oninput="numuneHesap()"></div>
      <div class="form-grup"><label>KDV (%)</label><input type="number" id="n-kdv" value="20" oninput="numuneHesap()"></div>
    </div>
    <div id="n-hesap" style="color:var(--yesil);font-size:13px;margin-bottom:8px"></div>
    ${tur==='Karot' ? `<div class="form-grup"><label>İş Adı / İnşaat Adı</label><input id="n-isadi" placeholder="Örn: Kayapınar Konut Projesi"></div>` : ''}
    <div class="form-grup"><label>Not</label><input id="n-not"></div>
  `, async () => {
    const mid = document.getElementById('n-musteri').value;
    if (!mid) { alert('Lütfen bir müşteri seçin!'); return; }
    const adet = +document.getElementById('n-adet').value || 1;
    const fiyat = +document.getElementById('n-fiyat').value || 0;
    const kdv = +document.getElementById('n-kdv').value || 0;
    const kdvsiz = adet * fiyat;
    const kdvt = kdvsiz * kdv / 100;
    const mEl = document.querySelector('#n-musteri option:checked');
    const caplar = tur === 'Celik'
      ? [...document.querySelectorAll('.cap-cb:checked')].map(c=>c.value).join(',')
      : '';
    const body = {
      tur, musteri_id: +mid,
      musteri_adi: mEl?.dataset.firma || '',
      tarih: document.getElementById('n-tarih').value,
      yibf: document.getElementById('n-yibf').value,
      belediye: document.getElementById('n-belediye').value,
      blok: document.getElementById('n-blok').value,
      kat: document.getElementById('n-kat').value,
      m3: document.getElementById('n-m3')?.value || '',
      beton_sinifi: document.getElementById('n-sinif')?.value || '',
      caplar,
      adet, birim_fiyat: fiyat, kdv_oran: kdv,
      kdv_tutar: kdvt, toplam: kdvsiz, toplam_kdvli: kdvsiz + kdvt,
      not_: document.getElementById('n-not').value,
      is_adi: tur === 'Karot' ? (document.getElementById('n-isadi')?.value || '') : '',
    };
    const r = await api('/numuneler', 'POST', body);
    if (r) { modalKapat(); sayfalar[tur==='Taze Beton'?'taze_beton':tur==='Celik'?'celik':'karot'](); }
  });
}

function numuneMusteri() {
  const el = document.querySelector('#n-musteri option:checked');
  if (!el || !el.value) return;
  document.getElementById('n-belediye').value = el.dataset.bel || '';
  // Otomatik fiyat
  const tur = window._aktifNumuneTur;
  const fiyatKey = tur==='Taze Beton'?'beton':tur==='Celik'?'celik':'karot';
  document.getElementById('n-fiyat').value = el.dataset[fiyatKey] || 0;
  numuneHesap();
}

function numuneHesap() {
  const a = +document.getElementById('n-adet')?.value || 0;
  const f = +document.getElementById('n-fiyat')?.value || 0;
  const k = +document.getElementById('n-kdv')?.value || 0;
  const kdvsiz = a * f;
  const kdvli = kdvsiz * (1 + k/100);
  const el = document.getElementById('n-hesap');
  if (el) el.textContent = `${a} × ${f.toLocaleString('tr-TR')} ₺ = KDVsiz: ${kdvsiz.toLocaleString('tr-TR')} ₺ | KDVli: ${kdvli.toLocaleString('tr-TR')} ₺`;
}

// ── ARAMA FONKSİYONLARI ──────────────────────────────────────────────────────
function aramaAc() {
  document.getElementById('arama-overlay').style.display = 'block';
  document.getElementById('arama-panel').style.display = 'block';
  document.getElementById('arama-input').focus();
  document.getElementById('arama-sonuclar').innerHTML = '';
}

function aramaKapat() {
  document.getElementById('arama-overlay').style.display = 'none';
  document.getElementById('arama-panel').style.display = 'none';
  document.getElementById('arama-input').value = '';
}

async function aramaYap() {
  const q = document.getElementById('arama-input').value.trim().toLowerCase();
  const el = document.getElementById('arama-sonuclar');
  if (q.length < 2) { el.innerHTML = '<p style="color:var(--ikincil);padding:8px">En az 2 karakter girin</p>'; return; }

  const [musteriler, numuneler] = await Promise.all([api('/musteriler'), api('/numuneler')]);
  const sonuclar = [];

  // Musteri ara
  (musteriler||[]).filter(m =>
    m.firma.toLowerCase().includes(q) || (m.belediye||'').toLowerCase().includes(q) || (m.telefon||'').includes(q)
  ).forEach(m => sonuclar.push({tip:'Müşteri', baslik: m.firma, alt: `${m.tip} | ${m.belediye||''}`, sayfa:'musteri_detay', id: m.id}));

  // Numune ara
  (numuneler||[]).filter(n =>
    (n.yibf||'').toLowerCase().includes(q) ||
    (n.musteri_adi||'').toLowerCase().includes(q) ||
    (n.belediye||'').toLowerCase().includes(q) ||
    (n.blok||'').toLowerCase().includes(q)
  ).slice(0,15).forEach(n => sonuclar.push({
    tip: n.tur, baslik: `${n.musteri_adi||'?'} - ${n.yibf||'YİBF yok'}`,
    alt: `${n.tarih} | ${n.belediye||''} ${n.blok||''} ${n.kat||''} | ${para(n.toplam_kdvli)}`,
    sayfa: n.tur==='Taze Beton'?'taze_beton':n.tur==='Celik'?'celik':'karot'
  }));

  if (!sonuclar.length) { el.innerHTML = '<p style="color:var(--ikincil);padding:12px">Sonuç bulunamadı</p>'; return; }

  el.innerHTML = sonuclar.map(s => `
    <div onclick="aramaKapat();sayfaGit('${s.sayfa}')" style="padding:12px 16px;border-bottom:1px solid var(--kenar);cursor:pointer;border-radius:8px" 
      onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background=''">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:11px;padding:2px 8px;background:var(--kenar);border-radius:99px;color:var(--ikincil)">${s.tip}</span>
        <strong style="font-size:14px">${s.baslik}</strong>
      </div>
      <div style="font-size:12px;color:var(--ikincil);margin-top:4px">${s.alt}</div>
    </div>`).join('');
}

// Ctrl+K ile arama aç
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); aramaAc(); }
});

// ── MÜŞTERİ DETAY FONKSİYONLARI ─────────────────────────────────────────────
async function musteriDetayYukle() {
  const mid = document.getElementById('detay-musteri')?.value;
  const el = document.getElementById('musteri-detay-icerik');
  const exportDiv = document.getElementById('detay-exportler');
  if (!mid) { el.innerHTML = ''; exportDiv.style.display='none'; return; }

  exportDiv.style.display = 'flex';
  el.innerHTML = '<p style="color:var(--ikincil);padding:20px">Yükleniyor...</p>';

  const [m, numuneler, gelirler] = await Promise.all([
    api(`/musteriler/${mid}`),
    api('/numuneler'),
    api('/gelirler')
  ]);
  if (!m) return;

  const mNum = (numuneler||[]).filter(n => n.musteri_id == mid);
  const mGel = (gelirler||[]).filter(g => g.musteri_id == mid || g.musteri_adi === m.firma);

  const toplamBorç = mNum.reduce((s,n) => s+(n.toplam_kdvli||0), 0);
  const toplamTahsilat = mGel.reduce((s,g) => s+(g.tutar||0), 0);
  const kalan = toplamBorç - toplamTahsilat;
  const sf = m.fiyatlar?.[m.fiyatlar.length-1] || {};

  window._detayMusteri = m;
  window._detayNumuneler = mNum;
  window._detayGelirler = mGel;

  el.innerHTML = `
    <div class="kart-grid kart-grid-4" style="margin-bottom:12px">
      <div class="kart"><div class="k-baslik">Toplam Numune Tutarı</div>
        <div class="k-deger" style="color:var(--ana)">${para(toplamBorç)}</div></div>
      <div class="kart"><div class="k-baslik">Tahsil Edildi</div>
        <div class="k-deger" style="color:var(--yesil)">${para(toplamTahsilat)}</div></div>
      <div class="kart"><div class="k-baslik">Kalan Alacak</div>
        <div class="k-deger" style="color:${kalan>0?'var(--turuncu)':'var(--yesil)'}">${para(kalan)}</div></div>
      <div class="kart"><div class="k-baslik">Numune Sayısı</div>
        <div class="k-deger" style="color:var(--mor)">${mNum.length} adet</div></div>
    </div>

    <div class="kart" style="margin-bottom:12px">
      <div style="display:flex;gap:24px;flex-wrap:wrap;font-size:13px">

function musteriExcel() {
  const m = window._detayMusteri;

  let csv = '﻿'; // BOM for Turkish chars
  csv += `MÜŞTERİ DETAY RAPORU - ${m.firma}
`;
  csv += `Tarih: ${new Date().toLocaleDateString('tr-TR')}

`;
  csv += 'NUMUNELER\n';
  csv += 'Tarih,Tür,YİBF,Blok,Kat,Adet,KDVsiz,KDVli,Durum\n';
  nums.forEach(n => {
    csv += `${n.tarih},${n.tur},${n.yibf||''},${n.blok||''},${n.kat||''},${n.adet},${n.toplam||0},${n.toplam_kdvli||0},${n.durum}
`;
  });
  csv += '\nTAHSİLATLAR\n';
  csv += 'Tarih,Açıklama,Ödeme Türü,Tutar\n';
  gels.forEach(g => { csv += `${g.tarih},${g.aciklama},${g.odeme_turu||''},${g.tutar}
`; });

  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});

  a.href = URL.createObjectURL(blob);

  a.click();
}
